<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#302018"><title>Из грязи в князи — Пересборка</title><style>
:root{--ink:#3e291e;--gold:#9b6324;--red:#7b3029;--paper:#ead5a5;--edge:#aa7e45}*{box-sizing:border-box}body{margin:0;background:#1e1513;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:610px;min-height:100dvh;margin:auto;padding:10px;background:radial-gradient(ellipse at 50% 25%,#6c4c32,#201615 80%)}.book{border:9px ridge #563625;border-radius:19px;background:repeating-linear-gradient(105deg,#f0dfb6,#e8d2a0 16px,#e7d0a0 19px);min-height:calc(100dvh - 20px);box-shadow:0 0 0 2px #c39959 inset,0 8px 35px #000b;overflow:hidden;position:relative}.book:before{content:'❦';position:absolute;right:13px;top:8px;color:#a7743c;opacity:.5;font-size:32px}.header{text-align:center;padding:17px 12px 9px;border-bottom:2px double #ad814c;background:linear-gradient(#e8d1a1aa,#d4b47a55)}.title{font-size:clamp(24px,7vw,36px);font-weight:bold;color:#693527;text-shadow:1px 1px #ffecb9}.subtitle{font-size:13px;color:#7b573c}.money{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f9e9c6aa;border:1px solid #b58b4b;border-radius:9px;margin:10px 12px;padding:9px;font-weight:bold}.money small{display:block;font-size:11px;font-weight:normal}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px 10px}.nav button{border:1px solid #4d201d;background:linear-gradient(#9e4b3b,#612621);color:#fff0d0;padding:10px 2px;border-radius:8px;font-size:12px}.nav button.active{background:linear-gradient(#c59649,#94602e);color:#24140e;border-color:#75441d}.body{padding:4px 13px 20px;min-height:460px}.panel{border:1px solid #bb965e;background:#fff2d1a8;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 0 #fff5d5 inset}.panel h3{margin:0 0 8px;color:#743c2c;font-size:18px}.panel p{margin:7px 0;line-height:1.4}.muted{color:#806b54;font-size:13px}.btn{background:linear-gradient(#a66c3c,#784223);color:#fff5da;border:1px solid #653b24;border-radius:7px;padding:9px 11px;margin:4px 4px 4px 0;min-height:40px}.btn.alt{background:linear-gradient(#f5e5b9,#ddc08b);color:#573821;border-color:#ae8554}.btn.red{background:linear-gradient(#a45145,#733029)}.btn.full{width:100%;margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.row>*{min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.badge{display:inline-block;border:1px solid #b18a51;background:#eed5a0;border-radius:20px;padding:3px 8px;font-size:12px}.world{height:290px;border:5px ridge #977248;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(#a7c9cb 0 38%,#719258 39% 57%,#68814a 58% 100%)}.world.fish{background:linear-gradient(#a8c6d2 0 35%,#6c9d9c 36% 58%,#b5a579 59% 100%)}.world.city{background:linear-gradient(#b5c5c4 0 35%,#a59c7b 36% 58%,#8e856a 59% 100%)}.world.market{background:linear-gradient(#d3bd9a 0 37%,#bba078 38% 58%,#a88c63 59% 100%)}.world.castle{background:linear-gradient(#a4b5c8 0 37%,#9d9b91 38% 58%,#7c8170 59% 100%)}.hill{position:absolute;top:32%;height:70px;width:90%;border-radius:50% 50% 0 0;background:#6b855d;left:-20%}.hill.b{left:44%;top:35%;background:#7f9466}.plot{position:absolute;width:29%;height:78px;border:0;background:transparent;padding:0;z-index:2}.plot:before{content:'';position:absolute;left:7%;right:7%;bottom:0;height:22px;border-radius:50%;background:#75563780;transform:skewX(-12deg)}.plot .building{position:relative;display:block;font-size:43px;filter:drop-shadow(1px 3px 1px #3e342b66)}.plot .label{position:relative;display:block;background:#f5e1b8e8;border:1px solid #9b7449;border-radius:5px;font-size:10px;line-height:1.1;padding:2px}.plot.empty .building{font-size:32px;opacity:.7}.plot.p0{left:3%;top:45%}.plot.p1{left:35%;top:39%}.plot.p2{right:3%;top:49%}.plot.p3{left:13%;top:70%}.plot.p4{right:13%;top:71%}.hero{position:absolute;left:43%;top:64%;font-size:57px;background:transparent;border:0;z-index:4;filter:drop-shadow(1px 4px 2px #392b2188);animation:idle 2.3s ease-in-out infinite}.hero:active{transform:scale(.92)}@keyframes idle{50%{translate:0 -4px}}.tap{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:12px;color:#fff9e5;text-shadow:0 1px 3px #000;background:#4a362e75;padding:4px}.line{height:1px;background:#bd965e;margin:12px 0}.toast{position:fixed;z-index:30;left:50%;bottom:25px;transform:translateX(-50%);max-width:92%;width:440px;background:#3c2a21;color:#ffedc8;border:2px solid #d1a56a;border-radius:10px;padding:12px;text-align:center;box-shadow:0 6px 20px #0008;display:none}.modal{position:fixed;inset:0;background:#160e0bd9;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal .sheet{background:repeating-linear-gradient(110deg,#f4e3bb,#ead3a0 28px);border:8px ridge #805432;border-radius:15px;max-width:500px;max-height:90dvh;overflow:auto;padding:18px;box-shadow:0 10px 45px #000c}.modal h2{color:#783b2e;margin:0 0 10px}.modal p{line-height:1.5}.hidden{display:none!important}.item{border-top:1px solid #c9aa77;padding:9px 0}.item:first-child{border:0}.small{font-size:12px}.ok{color:#426a32}.bad{color:#a13d35}select,input[type=file]{max-width:100%} .notice{border-left:4px solid #a65a39;padding-left:9px}.footer{text-align:center;color:#9e7b4e;font-size:11px;padding:8px} @media(max-width:370px){.nav button{font-size:11px}.plot .building{font-size:36px}.body{padding:3px 9px 15px}}
</style></head><body><div class="app"><div class="book"><header class="header"><div class="title">❦ Из грязи в князи ❦</div><div class="subtitle" id="sub">Летопись одного возвышения</div></header><div class="money"><div><span id="wallet">0</span><small id="curr">Деревянные дублоны</small></div><div style="text-align:right"><span id="rank">Бедный крестьянин</span><small id="income">Доход: 0/с</small></div></div><nav class="nav" id="nav"></nav><main class="body" id="content"></main><div class="footer">✥ Пересобранная версия 4.0 · сохранение на устройстве ✥</div></div></div><div class="toast" id="toast"></div><div id="modalHost"></div><script>
'use strict';
const L=[
 {name:'Далёкая деревня',money:'деревянные дублоны',short:'дубл.',class:'',desc:'Здесь начинается твоя история. Поля, леса и бедные хозяйства. Каждая заработанная монета приближает тебя к свободе.',npc:'Староста Мирон',business:[['Огород','🥬','Овощи',35,1,3],['Курятник','🐓','Яйца',80,2,4],['Лесопилка','🪵','Доски',160,3,6],['Мельница','🏠','Мука',300,5,8],['Пекарня','🥖','Хлеб',520,8,10]],unlock:0},
 {name:'Рыбацкая деревня',money:'гроши',short:'гр.',class:'fish',desc:'Ты добрался до морского берега. Здесь богатеют на улове, соли и дальних рейсах. Капитан Ратибор готов дать тебе шанс.',npc:'Капитан Ратибор',business:[['Причал','⚓','Рыба',40,1,3],['Солильня','🧂','Соль',100,2,5],['Коптильня','🐟','Копчёная рыба',210,4,7],['Верфь','⛵','Доски',370,6,9],['Рыбный склад','🏚️','Рыба',650,10,12]],unlock:450},
 {name:'Город',money:'серебряники',short:'сер.',class:'city',desc:'Каменные улицы, цеха и шумные мастерские. Мастер Агата учит: ремесло делает бедняка состоятельным.',npc:'Мастер Агата',business:[['Кузница','⚒️','Железо',55,2,3],['Столярная','🪚','Доски',120,3,5],['Пекарня','🥖','Хлеб',260,5,7],['Ткацкая','🧵','Ткань',460,8,9],['Оружейная','🛡️','Инструменты',800,13,12]],unlock:600},
 {name:'Городской рынок',money:'золотые монеты',short:'зол.',class:'market',desc:'На большом торгу встречаются купцы со всех земель. Купец Савва знает: удачная сделка стоит десятка тяжёлых трудов.',npc:'Купец Савва',business:[['Лавка','🏪','Торговые тюки',70,2,3],['Склад','📦','Торговые тюки',150,4,5],['Трактир','🍲','Хлеб',300,6,7],['Караван-сарай','🐫','Ткань',550,10,9],['Торговый дом','🏛️','Торговые тюки',950,16,12]],unlock:750},
 {name:'Замок',money:'золотые слитки',short:'сл.',class:'castle',desc:'Перед тобой королевский замок. Здесь решается судьба знатных домов. Канцлер Леон ждёт доказательств твоего достоинства.',npc:'Канцлер Леон',business:[['Конюшня','🐎','Королевские припасы',85,3,3],['Кухня','🍗','Королевские припасы',180,5,5],['Казарма','🏰','Железо',350,8,7],['Монетный двор','🪙','Золотые слитки',650,13,9],['Поместье','🏯','Королевские припасы',1100,20,12]],unlock:1000}
];
const GEAR=[{id:'ring',name:'Кольцо пахаря',icon:'💍',cost:90,bonus:'Увеличивает доход от нажатий на 20%',tap:.2,pass:0},{id:'gloves',name:'Рабочие перчатки',icon:'🧤',cost:160,bonus:'Увеличивают доход от нажатий на 25%',tap:.25,pass:0},{id:'boots',name:'Сапоги торговца',icon:'🥾',cost:280,bonus:'Увеличивают доход всех предприятий на 10%',tap:0,pass:.1},{id:'cloak',name:'Плащ купца',icon:'🧥',cost:450,bonus:'Увеличивает доход всех предприятий на 20%',tap:0,pass:.2},{id:'crown',name:'Венец вельможи',icon:'👑',cost:800,bonus:'Увеличивает доход от нажатий и предприятий на 30%',tap:.3,pass:.3}];
const RANKS=['Бедный крестьянин','Зажиточный хозяин','Почётный ремесленник','Городской купец','Советник торгового двора','Королевский вельможа'];
const KEY='knyazi_rebuilt_v4';
function initial(){return {version:4,loc:0,unlocked:0,wallets:[50,0,0,0,0],biz:Array.from({length:5},()=>Array.from({length:5},()=>({level:0,workers:0,stock:0}))),owned:[],equipped:[],reputation:[0,0,0,0,0],quests:[0,0,0,0,0],rank:0,storySeen:[true,false,false,false,false],last:Date.now(),taps:0,log:[]}}
let s=initial(),tab='Главная',toastTimer=null;
const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ru-RU');
function safe(s0){return String(s0).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(v){if(!v||typeof v!=='object'||!Array.isArray(v.wallets))return null;let n=initial();n.loc=Math.min(4,Math.max(0,Number(v.loc)||0));n.unlocked=Math.min(4,Math.max(n.loc,Number(v.unlocked)||0));for(let i=0;i<5;i++){n.wallets[i]=Math.max(0,Number(v.wallets[i])||0);n.reputation[i]=Math.max(0,Number(v.reputation?.[i])||0);n.quests[i]=Math.max(0,Math.floor(Number(v.quests?.[i])||0));for(let j=0;j<5;j++){let b=v.biz?.[i]?.[j]||{};n.biz[i][j]={level:Math.max(0,Math.min(100,Math.floor(Number(b.level)||0))),workers:Math.max(0,Math.min(10,Math.floor(Number(b.workers)||0))),stock:Math.max(0,Number(b.stock)||0)}}}n.owned=Array.isArray(v.owned)?v.owned.filter(x=>GEAR.some(g=>g.id===x)):[];n.equipped=Array.isArray(v.equipped)?v.equipped.filter(x=>n.owned.includes(x)):[];n.rank=Math.min(5,Math.max(0,Number(v.rank)||0));n.storySeen=Array.from({length:5},(_,i)=>!!v.storySeen?.[i]);n.last=Math.min(Date.now(),Number(v.last)||Date.now());n.taps=Number(v.taps)||0;n.log=Array.isArray(v.log)?v.log.slice(-30).map(String):[];return n}
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){notice('Не удалось сохранить: проверь свободное место')}}
function load(){try{let old=localStorage.getItem(KEY);if(old){let n=normalize(JSON.parse(old));if(n){s=n;let sec=Math.min(7200,Math.max(0,(Date.now()-s.last)/1000));let total=0;for(let i=0;i<=s.unlocked;i++){let val=income(i)*sec;s.wallets[i]+=val;total+=val;for(let j=0;j<5;j++)s.biz[i][j].stock+=production(i,j)*sec}if(total>1)setTimeout(()=>notice('Пока тебя не было, предприятия заработали местную валюту во всех открытых землях.'),500);save();return}}}catch(e){console.warn(e)}setTimeout(()=>intro(),100)}
function notice(t){let el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3300)}
function addLog(t){s.log.push(new Date().toLocaleDateString('ru-RU')+' — '+t);s.log=s.log.slice(-30)}
function tapBonus(){return 1+GEAR.filter(g=>s.equipped.includes(g.id)).reduce((v,g)=>v+g.tap,0)}
function passBonus(){return 1+GEAR.filter(g=>s.equipped.includes(g.id)).reduce((v,g)=>v+g.pass,0)}
function income(i){return s.biz[i].reduce((sum,b,j)=>sum+(b.level?L[i].business[j][4]*b.level*(1+b.workers*.35):0),0)*passBonus()}
function production(i,j){let b=s.biz[i][j];return b.level?b.level*(1+b.workers*.2)/18:0}
function buildCost(i,j){let b=s.biz[i][j],base=L[i].business[j][3];return Math.floor(base*Math.pow(1.62,b.level))}
function wageCost(i,j){return Math.floor(30*(j+1)*(1+s.biz[i][j].workers)*Math.pow(1.25,i))}
function doTap(){let gain=(1+s.rank)*tapBonus();s.wallets[s.loc]+=gain;s.taps++;save();updateHead();notice('+'+fmt(gain)+' '+L[s.loc].short)}
function buyBiz(j){let i=s.loc,b=s.biz[i][j],c=buildCost(i,j);if(s.wallets[i]<c)return notice('Не хватает местной валюты');s.wallets[i]-=c;b.level++;addLog((b.level===1?'Построено: ':'Улучшено: ')+L[i].business[j][0]);save();render();notice('Предприятие '+(b.level===1?'построено':'улучшено'))}
function worker(j){let i=s.loc,b=s.biz[i][j],c=wageCost(i,j);if(!b.level)return notice('Сначала построй предприятие');if(b.workers>=5)return notice('На предприятии уже 5 работников');if(s.wallets[i]<c)return notice('Недостаточно денег на найм');s.wallets[i]-=c;b.workers++;save();render();notice('Работник нанят! Доход предприятия увеличен на 35%')}
function fire(j){let b=s.biz[s.loc][j];if(b.workers>0)b.workers--;save();render()}
function sell(j,all=false){let i=s.loc,b=s.biz[i][j],qty=Math.min(Math.floor(b.stock),all?1e9:10);if(qty<=0)return notice('На складе нет товара');b.stock-=qty;let price=L[i].business[j][5];s.wallets[i]+=qty*price;save();render();notice('Продано '+qty+' ед. за '+fmt(qty*price)+' '+L[i].short)}
function equip(id){if(!s.owned.includes(id))return;let ix=s.equipped.indexOf(id);if(ix>=0)s.equipped.splice(ix,1);else s.equipped.push(id);save();render()}
function buyGear(id){let g=GEAR.find(x=>x.id===id);if(s.owned.includes(id))return equip(id);if(s.wallets[s.loc]<g.cost)return notice('Недостаточно местной валюты');s.wallets[s.loc]-=g.cost;s.owned.push(id);s.equipped.push(id);save();render();notice('Куплено и надето: '+g.name)}
function questData(i){let step=s.quests[i];let j=step%5;let count=5+Math.floor(step/5)*4;let b=L[i].business[j];return {j,count,b,reward:80+step*35+20*i}}
function completeQuest(){let i=s.loc,q=questData(i),b=s.biz[i][q.j];if(b.stock<q.count)return notice('Нужно собрать '+q.count+' ед. «'+q.b[2]+'»');b.stock-=q.count;s.wallets[i]+=q.reward;s.reputation[i]+=2;s.quests[i]++;addLog('Выполнено поручение '+L[i].npc);save();render();notice('Поручение выполнено! +'+q.reward+' и +2 уважения')}
function help(){let i=s.loc,c=75+25*i;if(s.wallets[i]<c)return notice('Для помощи нужно '+c+' '+L[i].short);s.wallets[i]-=c;s.reputation[i]+=3;addLog('Помощь жителям '+L[i].name);save();render();notice('Поселение благодарит тебя! +3 уважения')}
function exchange(){let i=s.loc;if(i>=4||s.unlocked<=i)return notice('Сначала открой следующую локацию');let amt=Math.floor(s.wallets[i]/10)*10;if(amt<10)return notice('Для обмена нужно хотя бы 10 '+L[i].short);let gain=Math.floor(amt*.9);s.wallets[i]-=amt;s.wallets[i+1]+=gain;save();render();notice('Обменено '+fmt(amt)+' → '+fmt(gain)+' '+L[i+1].short)}
function caravan(j){let i=s.loc;if(i>=4||s.unlocked<=i)return notice('Следующая локация ещё закрыта');let b=s.biz[i][j],qty=Math.min(10,Math.floor(b.stock));if(qty<10)return notice('Для каравана нужно 10 ед. товара');b.stock-=10;let gain=L[i].business[j][5]*15;s.wallets[i+1]+=gain;save();render();notice('Караван доставил товар: +'+gain+' '+L[i+1].short)}
function canUnlock(){let i=s.unlocked;if(i>=4)return false;return s.quests[i]>=2&&s.reputation[i]>=4&&s.wallets[i]>=L[i+1].unlock}
function unlock(){let i=s.unlocked;if(!canUnlock())return notice('Сначала выполни условия перехода');let c=L[i+1].unlock;s.wallets[i]-=c;s.unlocked=i+1;s.loc=i+1;s.wallets[i+1]+=80;s.storySeen[i+1]=true;addLog('Открыта новая глава: '+L[i+1].name);save();tab='Главная';render();story(i+1)}
function go(i){if(i>s.unlocked)return notice('Эта земля ещё не открыта');s.loc=i;tab='Главная';save();render()}
function rankUp(){let next=s.rank+1;if(next>=6)return;let needed=next*5;let total=s.reputation.reduce((a,b)=>a+b,0);let c=150*next;if(total<needed||s.wallets[s.loc]<c)return notice('Для титула нужно '+needed+' уважения и '+c+' местной валюты');s.wallets[s.loc]-=c;s.rank=next;addLog('Новый титул: '+RANKS[next]);save();render();notice('Поздравляем! '+RANKS[next])}
function updateHead(){$('wallet').textContent=fmt(s.wallets[s.loc]);$('curr').textContent=L[s.loc].money;$('rank').textContent=RANKS[s.rank];$('income').textContent='Доход: '+fmt(income(s.loc))+'/с';$('sub').textContent=L[s.loc].name+' · глава '+(s.loc+1)+' из 5';}
const TABS=['Главная','Владения','Рынок','Задания','Герой','Карта','Летопись','Настройки'];
function render(){updateHead();$('nav').innerHTML=TABS.map(x=>`<button class="${x===tab?'active':''}" data-tab="${x}">${x}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let html='';if(tab==='Главная')html=home();if(tab==='Владения')html=holdings();if(tab==='Рынок')html=market();if(tab==='Задания')html=quests();if(tab==='Герой')html=heroPage();if(tab==='Карта')html=mapPage();if(tab==='Летопись')html=chronicle();if(tab==='Настройки')html=settings();$('content').innerHTML=html;bind()}
function home(){let i=s.loc;let plots=s.biz[i].map((b,j)=>{let d=L[i].business[j];return `<button class="plot p${j} ${b.level?'':'empty'}" data-plot="${j}"><span class="building">${b.level?d[1]:'🟤'}</span><span class="label">${b.level?safe(d[0])+' · '+(b.level>=5?'III':b.level>=3?'II':'I'):'Свободный участок'}</span></button>`}).join('');return `<div class="panel"><h3>✥ ${L[i].name}</h3><p>${L[i].desc}</p></div><div class="world ${L[i].class}"><div class="hill"></div><div class="hill b"></div>${plots}<button class="hero" id="heroTap" aria-label="Заработать валюту">${s.rank>=4?'🤴':s.rank>=2?'🧑‍💼':'🧑‍🌾'}</button><div class="tap">Нажми на героя, чтобы заработать · +${((1+s.rank)*tapBonus()).toFixed(1)} за нажатие</div></div><div class="panel"><h3>🎯 Твоя ближайшая цель</h3>${goalText()}<button class="btn alt" data-tab="Задания">Открыть задания</button></div><div class="panel"><p class="muted">Коснись пустого участка, чтобы построить хозяйство. Улучшения меняют уровень здания и увеличивают доход.</p></div>`}
function holdings(){let i=s.loc;return `<div class="panel"><h3>🏘️ Предприятия и работники</h3><p class="muted">Найм оплачивается один раз. Каждый работник добавляет +35% к доходу предприятия и +20% к производству товаров. Не больше 5 работников на здание.</p>${s.biz[i].map((b,j)=>{let d=L[i].business[j],c=buildCost(i,j);return `<div class="item"><div class="row"><b>${d[1]} ${d[0]}</b><span class="badge">Уровень ${b.level}</span></div><div class="muted">${b.level?'Доход: '+fmt(d[4]*b.level*(1+b.workers*.35)*passBonus())+'/с · Склад: '+fmt(b.stock)+' '+d[2]:'Участок пуст'}</div><button class="btn" data-build="${j}">${b.level?'Улучшить':'Построить'} · ${fmt(c)}</button>${b.level?`<div class="small">👨‍🌾 Работники: <b>${b.workers}/5</b> · Найм: ${fmt(wageCost(i,j))}</div><button class="btn alt" data-worker="${j}" ${b.workers>=5?'disabled':''}>Нанять работника</button><button class="btn alt" data-fire="${j}" ${!b.workers?'disabled':''}>Уволить</button>`:''}</div>`}).join('')}</div>`}
function market(){let i=s.loc;return `<div class="panel"><h3>⚖️ Меняльная лавка</h3><p>Курс: <b>10 ${L[i].short} → 9 ${L[Math.min(4,i+1)].short}</b>. Переводятся все полные десятки; комиссия 10%.</p><button class="btn" id="exchange" ${i>=4||s.unlocked<=i?'disabled':''}>Обменять излишки в следующую землю</button></div><div class="panel"><h3>📦 Торговля и караваны</h3>${s.biz[i].map((b,j)=>{let d=L[i].business[j];return `<div class="item"><b>${d[1]} ${d[2]}</b><div class="muted">На складе: ${fmt(b.stock)} · Цена: ${d[5]} ${L[i].short}/шт.</div><button class="btn alt" data-sell="${j}" >Продать 10</button><button class="btn alt" data-sellall="${j}" >Продать всё</button>${i<4?`<button class="btn" data-caravan="${j}" ${s.unlocked<=i?'disabled':''}>Караван: 10 шт. → ${d[5]*15} ${L[i+1].short}</button>`:''}</div>`}).join('')}</div><div class="panel"><h3>🛍️ Лавка снаряжения</h3><p class="muted">Здесь продаются только полезные предметы. Зерно и доски производятся предприятиями и используются в торговле.</p>${GEAR.map(g=>`<div class="item"><b>${g.icon} ${g.name}</b><p class="small">${g.bonus}</p><button class="btn" data-gear="${g.id}">${s.owned.includes(g.id)?s.equipped.includes(g.id)?'Снять':'Надеть':'Купить · '+g.cost}</button></div>`).join('')}</div>`}
function goalText(){let i=s.loc,q=questData(i);if(i===4&&s.rank===5)return '<p class="ok">🏆 Ты достиг вершины! Королевский вельможа — твоя история вошла в летопись.</p>';if(s.quests[i]<2)return `<p>Выполни поручения ${L[i].npc}: <b>${s.quests[i]}/2</b>. Следующее — передать <b>${q.count} ${q.b[2]}</b> из предприятия «${q.b[0]}».</p>`;if(s.reputation[i]<4)return '<p>Заслужи хотя бы <b>4 уважения</b> у местных жителей.</p>';if(i<4)return `<p>Накопи <b>${fmt(L[i+1].unlock)} ${L[i].short}</b> для открытия земли «${L[i+1].name}». Сейчас: ${fmt(s.wallets[i])}.</p>`;return '<p>Ты достиг замка. Повышай титул до королевского вельможи, выполняя поручения и помогая жителям.</p>'}
function quests(){let i=s.loc,q=questData(i),b=s.biz[i][q.j];return `<div class="panel"><h3>🎯 Главная цель</h3>${goalText()}</div><div class="panel"><h3>📜 Поручение: ${L[i].npc}</h3><p>«Нашим людям необходимы <b>${q.b[2]}</b>. Доставь <b>${q.count} шт.</b> из хозяйства «${q.b[0]}».»</p><p>Собрано: <b>${fmt(b.stock)} / ${q.count}</b> · Награда: ${q.reward} ${L[i].short} и 2 уважения.</p><button class="btn" id="questComplete" >Передать товар и получить награду</button></div><div class="panel"><h3>🤝 Помочь поселению</h3><p>Пожертвуй <b>${75+25*i} ${L[i].short}</b> на нужды жителей и получи <b>3 уважения</b>.</p><button class="btn" id="help" >Помочь поселению</button><p>Уважение жителей: <b>${fmt(s.reputation[i])}</b></p></div>${i<4?`<div class="panel"><h3>🚪 Путь дальше: ${L[i+1].name}</h3><p>Условия: 2 поручения, 4 уважения, ${L[i+1].unlock} ${L[i].short}.</p><p>Поручения: ${Math.min(2,s.quests[i])}/2 · Уважение: ${fmt(s.reputation[i])}/4</p><button class="btn red" id="unlock" ${i!==s.unlocked||!canUnlock()?'disabled':''}>Открыть следующую главу</button></div>`:''}`}
function heroPage(){let rep=s.reputation.reduce((a,b)=>a+b,0),next=s.rank+1;return `<div class="panel"><h3>👑 Герой и сословие</h3><p style="font-size:56px;text-align:center">${s.rank>=4?'🤴':s.rank>=2?'🧑‍💼':'🧑‍🌾'}</p><p>Титул: <b>${RANKS[s.rank]}</b></p><p>Общее уважение: <b>${fmt(rep)}</b> · Нажатий: ${fmt(s.taps)}</p>${next<6?`<p>Следующий титул: ${RANKS[next]} · Требуется ${next*5} уважения и ${150*next} местной валюты.</p><button class="btn" id="rankUp" ${rep<next*5||s.wallets[s.loc]<150*next?'disabled':''}>Получить титул</button>`:'<p class="ok">Ты достиг высшего титула!</p>'}</div><div class="panel"><h3>🎒 Инвентарь и бонусы</h3>${GEAR.map(g=>`<div class="item"><b>${g.icon} ${g.name}</b><p class="small">${g.bonus}</p><span class="badge">${s.owned.includes(g.id)?s.equipped.includes(g.id)?'Надето':'В сумке':'Не куплено'}</span> ${s.owned.includes(g.id)?`<button class="btn alt" data-gear="${g.id}">${s.equipped.includes(g.id)?'Снять':'Надеть'}</button>`:''}</div>`).join('')}<div class="line"></div><p>Общий бонус к нажатию: <b>+${Math.round((tapBonus()-1)*100)}%</b></p><p>Общий бонус к пассивному доходу: <b>+${Math.round((passBonus()-1)*100)}%</b></p></div>`}
function mapPage(){return `<div class="panel"><h3>🗺️ Пять глав твоей судьбы</h3>${L.map((l,i)=>`<div class="item"><div class="row"><b>${i+1}. ${l.name}</b><span class="badge">${i===s.loc?'Здесь':i<=s.unlocked?'Открыта':'Закрыта'}</span></div><p class="small">${l.desc}</p><p class="muted">Валюта: ${l.money} · В кошельке: ${fmt(s.wallets[i])}</p><button class="btn alt" data-go="${i}" ${i>s.unlocked?'disabled':''}>${i===s.loc?'Текущая локация':'Перейти'}</button></div>`).join('')}</div>`}
function chronicle(){return `<div class="panel"><h3>📖 Летопись возвышения</h3><p>Ты начал с пятидесяти деревянных дублонов и мечты добраться до королевского двора.</p>${L.slice(0,s.unlocked+1).map((l,i)=>`<div class="item"><b>Глава ${i+1}. ${l.name}</b><p class="small">${l.desc}</p><button class="btn alt" data-story="${i}">Перечитать главу</button></div>`).join('')}</div><div class="panel"><h3>🖋️ Записи о твоих делах</h3>${s.log.length?s.log.slice().reverse().map(x=>`<p class="small">✥ ${safe(x)}</p>`).join(''):'<p class="muted">Первые свершения ещё впереди.</p>'}</div>`}
function settings(){return `<div class="panel"><h3>⚙️ Сохранения</h3><p>Прогресс автоматически сохраняется на этом устройстве. Для переноса между файлами и версиями используй резервную копию.</p><button class="btn" id="backup">Скачать сохранение JSON</button><p><label class="btn alt" style="display:inline-block">Восстановить из JSON<input id="restore" type="file" accept="application/json,.json" style="display:none"></label></p><button class="btn red" id="reset">Начать новую игру</button></div><div class="panel"><h3>ℹ️ Как играть</h3><p>Нажимай на героя, строй предприятия, нанимай работников, собирай товары, выполняй поручения и открывай новые земли. У каждой земли своя валюта; обменник и караваны помогают перевести заработанное дальше.</p><p>Работники увеличивают доход. Предметы дают бонусы, указанные в инвентаре. Для перехода нужны поручения, уважение и деньги.</p><button class="btn alt" id="introAgain">Прочитать вступление</button></div>`}
function bind(){let c=$('content');c.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});c.querySelectorAll('[data-plot]').forEach(x=>x.onclick=()=>{tab='Владения';render();notice('Выбери предприятие для этого участка')});c.querySelectorAll('[data-build]').forEach(x=>x.onclick=()=>buyBiz(+x.dataset.build));c.querySelectorAll('[data-worker]').forEach(x=>x.onclick=()=>worker(+x.dataset.worker));c.querySelectorAll('[data-fire]').forEach(x=>x.onclick=()=>fire(+x.dataset.fire));c.querySelectorAll('[data-sell]').forEach(x=>x.onclick=()=>sell(+x.dataset.sell));c.querySelectorAll('[data-sellall]').forEach(x=>x.onclick=()=>sell(+x.dataset.sellall,true));c.querySelectorAll('[data-caravan]').forEach(x=>x.onclick=()=>caravan(+x.dataset.caravan));c.querySelectorAll('[data-gear]').forEach(x=>x.onclick=()=>buyGear(x.dataset.gear));c.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(+x.dataset.go));c.querySelectorAll('[data-story]').forEach(x=>x.onclick=()=>story(+x.dataset.story));let f=(id,fn)=>{let e=$(id);if(e)e.onclick=fn};f('heroTap',doTap);f('exchange',exchange);f('questComplete',completeQuest);f('help',help);f('unlock',unlock);f('rankUp',rankUp);f('backup',backup);f('reset',reset);f('introAgain',intro);let r=$('restore');if(r)r.onchange=restore}
function showModal(title,body,button='Продолжить'){let h=$('modalHost');h.innerHTML=`<div class="modal"><div class="sheet"><h2>${title}</h2>${body}<button class="btn full" id="closeModal">${button}</button></div></div>`;$('closeModal').onclick=()=>h.innerHTML=''}
function intro(){showModal('📖 Пролог. Из грязи в князи',`<p>Ты — бедный крестьянин без имени и титула. После долгих скитаний судьба привела тебя в <b>Далёкую деревню</b>. В кармане всего <b>50 деревянных дублонов</b>, а впереди — целое королевство.</p><p>Староста Мирон предлагает тебе честный путь: работай, обзаводись хозяйством, помогай жителям и завоёвывай уважение.</p><p><b>Твоя цель:</b> пройти пять земель, разбогатеть, стать известным купцом и добиться титула <b>королевского вельможи</b>.</p><p class="notice"><b>Начни с простого:</b> нажимай на героя, построй огород, собирай овощи и выполняй поручения. Затем открой Рыбацкую деревню.</p>`,'Начать мою историю')}
function story(i){let l=L[i];showModal('🎉 Новая глава: '+l.name,`<p><b>Поздравляем!</b> Ты стал ещё на шаг ближе к королевскому двору.</p><p>${l.desc}</p><p>Тебя встречает <b>${l.npc}</b> и предлагает новые хозяйства, товары и возможности.</p><p>Здесь расчёты идут в валюте <b>«${l.money}»</b>. Предыдущие земли продолжают приносить прибыль: возвращайся к ним, отправляй караваны и меняй излишки.</p><p><b>Новая цель:</b> построй первое предприятие, выполни поручения и заслужи уважение жителей.</p>`,'Продолжить путешествие')}
function backup(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iz_gryazi_v_knyazi_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function restore(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let n=normalize(JSON.parse(reader.result));if(!n)throw Error('Неверный формат');if(!confirm('Заменить текущий прогресс сохранением из файла?'))return;s=n;save();render();notice('Сохранение восстановлено')}catch(err){notice('Не удалось прочитать сохранение: '+err.message)}};reader.readAsText(file)}
function reset(){if(!confirm('Начать новую игру? Текущий прогресс будет потерян. Сначала сделай резервную копию.'))return;s=initial();tab='Главная';save();render();intro()}
let lastTick=Date.now();function tick(){let now=Date.now(),dt=Math.min(2,Math.max(0,(now-lastTick)/1000));lastTick=now;if(!dt)return;for(let i=0;i<=s.unlocked;i++){s.wallets[i]+=income(i)*dt;for(let j=0;j<5;j++)s.biz[i][j].stock+=production(i,j)*dt}updateHead();if(tab==='Владения'||tab==='Рынок'||tab==='Задания'){} }
load();render();setInterval(tick,1000);setInterval(save,5000);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{let now=Date.now(),dt=Math.min(7200,Math.max(0,(now-s.last)/1000));if(dt>3){for(let i=0;i<=s.unlocked;i++){s.wallets[i]+=income(i)*dt;for(let j=0;j<5;j++)s.biz[i][j].stock+=production(i,j)*dt}save();render()}lastTick=Date.now()}});
window.__gameTest={get:()=>s,set:(x)=>{s=normalize(x);save();render()},buyBiz,worker,help,completeQuest,unlock,exchange,buyGear,render,initial,questData};
</script></body></html>
