<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#302018" />
    <link rel="icon" href="assets/characters/rank-5.svg" />
    <title>Из грязи в князи — Пересборка</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="book">
        <header class="header">
          <div class="title">❦ Из грязи в князи ❦</div>
          <div class="subtitle" id="sub">Летопись одного возвышения</div>
        </header>
        <div class="money">
          <div>
            <span id="wallet">0</span
            ><small id="curr">Деревянные дублоны</small>
          </div>
          <div style="text-align: right">
            <span id="rank">Бедный крестьянин</span
            ><small id="income">Доход: 0/с</small>
          </div>
        </div>
        <nav aria-label="Разделы летописи" class="nav" id="nav"></nav>
        <main class="body" id="content"></main>
        <div class="footer">
          ✥ Летопись · версия 4.1 · сохранение на устройстве ✥
        </div>
      </div>
    </div>
    <div role="status" aria-live="polite" class="toast" id="toast"></div>
    <div id="modalHost"></div>
    <script type="module" src="src/game.mjs"></script>
  </body>
</html>
